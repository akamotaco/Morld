# cold archetype — daily context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
#
# 2026-07-05: 안드로이드/시스템 톤 대사(접속 확인/시스템 점검/절전 모드/코어 온도 등)를
# characters/비서.yaml 전용 override로 이관 — 공용 풀은 인간 냉담 톤만 유지.

archetype: cold
context: daily
intents:
  greet:
    templates:
    - id: plain_formal
      pattern: 안녕하십니까{end}
      state_bias:
        affinity: 0.3
    - id: acknowledge
      pattern: 오셨군요{end}
      state_bias:
        affinity: 0.6
    - id: silent_nod
      pattern: '...(짧게 고개를 끄덕인다)'
      state_bias:
        affinity: 0.2
        verbosity: -0.4
    - id: business
      pattern: 용건은{end}
      state_bias:
        affinity: 0.1
        aggression: 0.2
    - id: soft_miss
      pattern: '...{miss_expr}{end}'
      state_bias:
        affinity: 0.85
        trust: 0.7
      inner_bias:
        affinity: 0.85
        warmth: 0.5
        verbosity: -0.1
    - id: concern
      pattern: '...{concern_expr}?'
      state_bias:
        affinity: 0.75
      inner_bias:
        affinity: 0.8
        warmth: 0.4
    - id: terse_greeting
      pattern: '{terse}{end}'
      state_bias:
        affinity: 0.2
    - id: warm_rare
      pattern: '...오늘도 수고 많으십니다{end}'
      state_bias:
        affinity: 0.7
        trust: 0.6
      inner_bias:
        affinity: 0.75
        warmth: 0.4
    - id: formal_bow
      pattern: 문안 인사드립니다{end}
      state_bias:
        formality: 0.7
    slots:
      miss_expr:
      - 보고 싶었습니다
      - 기다렸습니다
      - 돌아오셨군요
      concern_expr:
      - 괜찮으십니까
      - 별일 없으셨습니까
      terse:
      - 그래
      - 왔나
      - ...음
      end:
      - .
      - ..
      - '...'
  thank:
    templates:
    - id: formal_thanks
      pattern: 감사합니다{end}
      state_bias:
        affinity: 0.3
    - id: minimal
      pattern: 감사{end}
      state_bias:
        affinity: 0.2
    - id: functional
      pattern: '{effect}{end}'
      state_bias:
        affinity: 0.5
    - id: sincere
      pattern: '...{emph_adv}, 고맙습니다{end}'
      state_bias:
        affinity: 0.85
        trust: 0.8
      inner_bias:
        affinity: 0.85
        warmth: 0.5
        trust: 0.7
    - id: cool_ack
      pattern: 수고하셨습니다{end}
      state_bias:
        affinity: 0.4
    - id: cooperation
      pattern: 협조 감사드립니다{end}
      state_bias:
        affinity: 0.5
        trust: 0.5
    - id: data_registered
      pattern: 기억해 두겠습니다{end}
      state_bias:
        formality: 0.6
        affinity: 0.5
    - id: mutual_growth
      pattern: '...{bond_phrase}. 감사합니다{end}'
      state_bias:
        affinity: 0.75
        trust: 0.7
      inner_bias:
        affinity: 0.8
        warmth: 0.4
    - id: humble
      pattern: 과분한 도움이었습니다{end}
      state_bias:
        affinity: 0.7
        formality: 0.6
      inner_bias:
        affinity: 0.75
        warmth: 0.3
    slots:
      effect:
      - 도움이 되었습니다
      - 유용했습니다
      - 큰 도움이 되었습니다
      emph_adv:
      - 정말로
      - 진심으로
      - 무척
      bond_phrase:
      - 저 혼자로는 무리였습니다
      - 이런 건 처음이었습니다
      - 기억에 남을 일입니다
      end:
      - .
      - ..
      - '...'
  complain:
    templates:
    - id: efficiency
      pattern: 효율이 떨어지고 있습니다{end}
      state_bias:
        fatigue: 0.6
    - id: tired_short
      pattern: 피곤합니다{end}
      state_bias:
        fatigue: 0.65
    - id: request_rest
      pattern: '...{rest_req}{end}'
      state_bias:
        fatigue: 0.7
        affinity: 0.6
      inner_bias:
        fatigue: 0.7
        affinity: 0.65
        warmth: 0.3
    - id: noise_irritation
      pattern: 소란스럽군요{end}
      state_bias:
        aggression: 0.4
        affinity: 0.2
    - id: headache
      pattern: '...머리가 무겁습니다{end}'
      state_bias:
        fatigue: 0.6
    - id: brief_sigh
      pattern: '...{sigh_word}{end}'
      state_bias:
        fatigue: 0.5
        affinity: 0.5
      inner_bias:
        fatigue: 0.5
        warmth: 0.2
    - id: quiet_tired
      pattern: 오늘은 여기까지만 하고 싶습니다{end}
      state_bias:
        fatigue: 0.8
        affinity: 0.6
      inner_bias:
        fatigue: 0.8
        affinity: 0.7
        warmth: 0.3
    slots:
      rest_req:
      - 조금 쉬고 싶습니다
      - 잠시 쉬어야겠습니다
      - 휴식이 필요합니다
      sigh_word:
      - 한계입니다
      - 벅찹니다
      - 오늘은 길군요
      end:
      - .
      - ..
      - '...'
