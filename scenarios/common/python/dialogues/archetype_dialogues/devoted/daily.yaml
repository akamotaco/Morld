# devoted archetype — daily context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3+ (2026-04-26): _LINES fallback 해소용 greet 인텐트.

archetype: devoted
context: daily
intents:
  greet:
    templates:
    - id: formal_call
      pattern: '부르셨습니까?'
      state_bias:
        formality: 0.6
        affinity: 0.4
    - id: at_service
      pattern: '네, 여기 있습니다. 말씀하세요.'
      state_bias:
        formality: 0.5
        affinity: 0.5
    - id: quiet_offer
      pattern: '...무엇을 도와드릴까요?'
      state_bias:
        affinity: 0.6
        verbosity: -0.3
    - id: bow
      pattern: '명령만 내려주십시오.'
      state_bias:
        formality: 0.7
        affinity: 0.5
    - id: ready
      pattern: '...당신을 위해 준비되어 있습니다.'
      state_bias:
        affinity: 0.7
  thank:
    templates:
    - id: thank_humble
      pattern: '과분한 배려이십니다. 감사합니다.'
      state_bias:
        affinity: 0.5
    - id: thank_debt
      pattern: '이 은혜, 잊지 않겠습니다.'
      state_bias:
        affinity: 0.7
        trust: 0.6
    - id: thank_soft
      pattern: '...받기만 하는군요. 감사합니다.'
      state_bias:
        affinity: 0.6
  complain:
    templates:
    - id: complain_tired
      pattern: '...조금 지쳤습니다. 곧 회복하겠습니다.'
      state_bias:
        fatigue: 0.6
    - id: complain_self
      pattern: '부족한 제가 답답하실 텐데요...'
      state_bias:
        confidence: -0.3
    - id: complain_rest
      pattern: '잠시... 휴식을 허락해 주시겠습니까.'
      state_bias:
        fatigue: 0.75
