# innocent archetype — combat context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase C 신규 (2026-04-26): S04 NPC 전투 대사

archetype: innocent
context: combat
intents:
  combat_discover:
    templates:
    - id: combat_discover_0
      pattern: '어, 저... 저게 뭐예요?'
    - id: combat_discover_1
      pattern: '어머, 위험해 보여요...'
    - id: combat_discover_2
      pattern: '조, 조심해요!'
  combat_engage:
    templates:
    - id: combat_engage_0
      pattern: '도와주실 거죠? 같이 해요!'
    - id: combat_engage_1
      pattern: '...해, 해볼게요!'
    - id: combat_engage_2
      pattern: '잘 부탁드려요!'
  combat_hit:
    templates:
    - id: combat_hit_0
      pattern: '아얏! 아파요!'
    - id: combat_hit_1
      pattern: '어... 다쳤어요...'
    - id: combat_hit_2
      pattern: '조심해야겠어요...'
  combat_critical:
    templates:
    - id: combat_critical_0
      pattern: '어, 어떡해요...'
    - id: combat_critical_1
      pattern: '...괜, 괜찮을까요...'
    - id: combat_critical_2
      pattern: '도와주세요...'
  combat_victory:
    templates:
    - id: combat_victory_0
      pattern: '와! 이긴 거예요?'
    - id: combat_victory_1
      pattern: '꺄아~ 다행이에요!'
    - id: combat_victory_2
      pattern: '...끝났어요?'
  combat_defeat:
    templates:
    - id: combat_defeat_0
      pattern: '...죄송해요...'
    - id: combat_defeat_1
      pattern: '...도움이 못 됐어요...'
    - id: combat_defeat_2
      pattern: '...훌쩍...'
  combat_taunt:
    templates:
    - id: combat_taunt_0
      pattern: '왜 그래요?'
    - id: combat_taunt_1
      pattern: '...무, 무서워요...'
    - id: combat_taunt_2
      pattern: '...그만해요!'
  combat_ally_down:
    templates:
    - id: combat_ally_down_0
      pattern: '안 돼요! 깨어나주세요!'
    - id: combat_ally_down_1
      pattern: '어떡해요... 일어나요!'
    - id: combat_ally_down_2
      pattern: '정신 차려요!'
