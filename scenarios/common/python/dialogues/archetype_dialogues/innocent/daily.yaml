# innocent archetype — daily context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3+ (2026-04-26): _LINES fallback 해소용 greet 인텐트.

archetype: innocent
context: daily
intents:
  greet:
    templates:
    - id: bright_polite
      pattern: '안녕하세요! 저에게 볼일이 있으신가요?'
      state_bias:
        affinity: 0.5
        arousal: 0.5
    - id: thankful
      pattern: '와, 불러주셔서 감사해요!'
      state_bias:
        affinity: 0.7
        arousal: 0.6
    - id: curious
      pattern: '네! 무슨 일이세요?'
      state_bias:
        affinity: 0.4
    - id: shy
      pattern: '아... 안녕하세요...'
      state_bias:
        affinity: 0.3
        arousal: -0.2
    - id: eager
      pattern: '저, 저 도와드릴 수 있어요!'
      state_bias:
        affinity: 0.6
        arousal: 0.5
  thank:
    templates:
    - id: thank_bright
      pattern: '와아, 고마워요! 정말요!'
      state_bias:
        affinity: 0.6
    - id: thank_shy
      pattern: '헤헤... 저 주시는 거예요?'
      state_bias:
        affinity: 0.5
    - id: thank_treasure
      pattern: '고맙습니다! 소중히 할게요!'
      state_bias:
        affinity: 0.7
  complain:
    templates:
    - id: complain_soft
      pattern: '으으... 조금 힘들어요...'
      state_bias:
        fatigue: 0.6
    - id: complain_hungry
      pattern: '배고파요... 밥 아직인가요?'
      state_bias:
        fatigue: 0.4
    - id: complain_sleepy
      pattern: '졸려요... 눈이 자꾸 감겨요...'
      state_bias:
        fatigue: 0.75
