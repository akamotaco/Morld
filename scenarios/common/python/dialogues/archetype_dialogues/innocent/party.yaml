# innocent archetype — party context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3 마이그레이트 (2026-04-26): npc_dialogue._LINES → hybrid party.yaml

archetype: innocent
context: party
intents:
  invite_accept:
    templates:
    - id: invite_accept_0
      pattern: '정말요? 제가 도움이 될게요!'
    - id: invite_accept_1
      pattern: '와, 같이 가도 돼요? 좋아요!'
  invite_decline:
    templates:
    - id: invite_decline_0
      pattern: '죄송해요. 지금은 조금 어려워요.'
    - id: invite_decline_1
      pattern: '마음만 받을게요. 정말 감사해요.'
  invite_switch:
    templates:
    - id: invite_switch_0
      pattern: '정말요? 가도 될까요...?'
    - id: invite_switch_1
      pattern: '궁금해요. 같이 가요!'
  invite_loyalty_decline:
    templates:
    - id: invite_loyalty_decline_0
      pattern: '이분들이 잘 대해주셔서요... 죄송해요.'
    - id: invite_loyalty_decline_1
      pattern: '지금은 여기가 제 자리인 것 같아요.'
  invite_full:
    templates:
    - id: invite_full_0
      pattern: '어라, 자리가 없는 것 같아요.'
  dismiss_leave:
    templates:
    - id: dismiss_leave_0
      pattern: '아쉽지만... 잘 지내세요!'
    - id: dismiss_leave_1
      pattern: '네, 알겠어요. 또 만나요!'
  vote_advance:
    templates:
    - id: vote_advance_0
      pattern: '끝까지 가봐요! 분명 좋은 일이 있을 거예요.'
    - id: vote_advance_1
      pattern: '여기서 돌아가면 아쉬울 것 같아요.'
  vote_return:
    templates:
    - id: vote_return_0
      pattern: '다들 지친 것 같아요. 돌아가요.'
    - id: vote_return_1
      pattern: '무리하지 않는 게 좋지 않을까요?'
  room_pref_battle:
    templates:
    - id: room_pref_battle_0
      pattern: '싸, 싸우는 거예요? 같이 해요!'
    - id: room_pref_battle_1
      pattern: '전투요? 지지 않을게요!'
    - id: room_pref_battle_2
      pattern: '으, 으음! 힘낼게요!'
  room_pref_rest:
    templates:
    - id: room_pref_rest_0
      pattern: '헥헥... 잠시 쉬어요...'
    - id: room_pref_rest_1
      pattern: '졸려요... 잠깐만요.'
    - id: room_pref_rest_2
      pattern: '쉬는 게 좋을 것 같아요!'
  room_pref_exit:
    templates:
    - id: room_pref_exit_0
      pattern: '이제 집에 가요?'
    - id: room_pref_exit_1
      pattern: '돌아가는 게 좋을 것 같아요!'
    - id: room_pref_exit_2
      pattern: '오늘은 여기까지... 그쵸?'
