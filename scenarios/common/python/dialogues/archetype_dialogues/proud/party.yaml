# proud archetype — party context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3 마이그레이트 (2026-04-26): npc_dialogue._LINES → hybrid party.yaml

archetype: proud
context: party
intents:
  invite_accept:
    templates:
    - id: invite_accept_0
      pattern: '...자네라면 받아들이지.'
    - id: invite_accept_1
      pattern: '조건이 맞는다면 함께 가지.'
  invite_decline:
    templates:
    - id: invite_decline_0
      pattern: '거절한다. 자네 밑은 어울리지 않아.'
    - id: invite_decline_1
      pattern: '...격이 맞지 않는다.'
  invite_switch:
    templates:
    - id: invite_switch_0
      pattern: '자네 쪽이 격에 맞는군. 간다.'
    - id: invite_switch_1
      pattern: '여기서 더 얻을 게 없다. 옮기지.'
  invite_loyalty_decline:
    templates:
    - id: invite_loyalty_decline_0
      pattern: '이미 약속한 일이 있다. 어길 수 없다.'
    - id: invite_loyalty_decline_1
      pattern: '지금 리더와의 신의를 깰 수는 없다.'
  invite_full:
    templates:
    - id: invite_full_0
      pattern: '자리가 차 있군. 다음에 보자.'
  dismiss_leave:
    templates:
    - id: dismiss_leave_0
      pattern: '...알겠다. 자네의 판단이라면 존중하지.'
    - id: dismiss_leave_1
      pattern: '그래. 여기서 갈라서지.'
  vote_advance:
    templates:
    - id: vote_advance_0
      pattern: '나아간다. 물러설 이유가 없지.'
    - id: vote_advance_1
      pattern: '여기서 돌아가는 건 부끄러운 일이다.'
  vote_return:
    templates:
    - id: vote_return_0
      pattern: '...지금은 후퇴가 옳다. 인정하자.'
    - id: vote_return_1
      pattern: '무리하면 모두를 잃는다. 돌아가자.'
  room_pref_battle:
    templates:
    - id: room_pref_battle_0
      pattern: '흥, 싸우겠다는 거냐? 받아주지.'
    - id: room_pref_battle_1
      pattern: '당연히 전투지. 다른 선택지가 있나?'
    - id: room_pref_battle_2
      pattern: '내 실력을 보여줄 때군.'
  room_pref_rest:
    templates:
    - id: room_pref_rest_0
      pattern: '흥, 잠깐 쉴 뿐이다. 약해서가 아니야.'
    - id: room_pref_rest_1
      pattern: '쳇, 어쩔 수 없군. 잠시만이다.'
    - id: room_pref_rest_2
      pattern: '...전열을 가다듬는 것뿐이다.'
  room_pref_exit:
    templates:
    - id: room_pref_exit_0
      pattern: '오늘은 이 정도로 봐주지.'
    - id: room_pref_exit_1
      pattern: '흥, 충분하다. 돌아가지.'
    - id: room_pref_exit_2
      pattern: '...현명한 후퇴도 실력이지.'
