# seductive archetype — daily context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3+ (2026-04-26): _LINES fallback 해소용 greet 인텐트.

archetype: seductive
context: daily
intents:
  greet:
    templates:
    - id: smile_invite
      pattern: '어머... 오랜만이네.'
      state_bias:
        affinity: 0.5
        arousal: 0.4
    - id: tease
      pattern: '왔구나? 보고 싶었는데.'
      state_bias:
        affinity: 0.7
        arousal: 0.5
    - id: linger
      pattern: '...이쪽으로 와.'
      state_bias:
        arousal: 0.6
        affinity: 0.5
    - id: playful_call
      pattern: '내가 부르길 기다렸지?'
      state_bias:
        confidence: 0.6
        arousal: 0.5
    - id: soft_welcome
      pattern: '후훗... 어서 와.'
      state_bias:
        affinity: 0.4
        arousal: 0.4
  thank:
    templates:
    - id: thank_tease
      pattern: '어머, 고마워. ...보답, 기대해도 좋아.'
      state_bias:
        affinity: 0.6
        arousal: 0.4
    - id: thank_praise
      pattern: '후훗, 센스 있네. 마음에 들어.'
      state_bias:
        affinity: 0.5
    - id: thank_caught
      pattern: '나한테 잘 보이고 싶은 거야? ...성공이야.'
      state_bias:
        affinity: 0.7
        arousal: 0.3
  complain:
    templates:
    - id: complain_bored
      pattern: '지루해... 재미있는 일 없어?'
      state_bias:
        fatigue: 0.4
    - id: complain_lean
      pattern: '피곤하네. ...어깨라도 빌려줄래?'
      state_bias:
        fatigue: 0.65
        affinity: 0.5
    - id: complain_lazy
      pattern: '이런 날은 아무것도 하기 싫어.'
      state_bias:
        fatigue: 0.6
