# timid archetype — dungeon context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3 마이그레이트 (2026-04-26): npc_dialogue._LINES → hybrid dungeon.yaml

archetype: timid
context: dungeon
intents:
  dungeon_ambient:
    templates:
    - id: dungeon_ambient_0
      pattern: '여, 여기 무서워요...'
    - id: dungeon_ambient_1
      pattern: '...방금 뭔가 소리 안 났어요?'
    - id: dungeon_ambient_2
      pattern: '빨리 지나가요, 네?'

  corrosion_rise:
    templates:
    - id: corrosion_rise_0
      pattern: '어떡해요... 이상해요...'
    - id: corrosion_rise_1
      pattern: '히익... 무서운 느낌이...'
    - id: corrosion_rise_2
      pattern: '...머리가 어지러워요...'
  corrosion_critical:
    templates:
    - id: corrosion_critical_0
      pattern: '히익... 무서워요... 도와주세요...'
    - id: corrosion_critical_1
      pattern: '어떡해요... 이상해... 못 견디겠어요...'
    - id: corrosion_critical_2
      pattern: '...죽을 것 같아요...'

  floor_descent:
    templates:
    - id: floor_descent_0
      pattern: '어... 더 가야 해요...?'
    - id: floor_descent_1
      pattern: '히익... 더 깊은 곳이라니...'
    - id: floor_descent_2
      pattern: '...무서워요... 같이 가요...'
  ally_corrosion_concern:
    templates:
    - id: ally_corrosion_concern_0
      pattern: '{victim}... 괜, 괜찮아요...?'
    - id: ally_corrosion_concern_1
      pattern: '아, 안 돼요... {victim}이(가)...'
    - id: ally_corrosion_concern_2
      pattern: '...{victim}... 어떡해요...'
