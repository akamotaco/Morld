# timid archetype — party context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속
# Phase B-3 마이그레이트 (2026-04-26): npc_dialogue._LINES → hybrid party.yaml

archetype: timid
context: party
intents:
  invite_accept:
    templates:
    - id: invite_accept_0
      pattern: '저, 정말요? 가, 갈게요...'
    - id: invite_accept_1
      pattern: '저 같은 게 도움이 될지 모르겠지만... 네.'
  invite_decline:
    templates:
    - id: invite_decline_0
      pattern: '죄, 죄송해요. 저는 좀...'
    - id: invite_decline_1
      pattern: '무, 무리예요. 못 가요.'
  invite_switch:
    templates:
    - id: invite_switch_0
      pattern: '저, 정말요? 옮겨도 되나요...?'
    - id: invite_switch_1
      pattern: '...네, 따라갈게요.'
  invite_loyalty_decline:
    templates:
    - id: invite_loyalty_decline_0
      pattern: '죄, 죄송해요. 이분들한테 받은 게 있어서요...'
    - id: invite_loyalty_decline_1
      pattern: '...여기 리더한테 미안해서요.'
  invite_full:
    templates:
    - id: invite_full_0
      pattern: '이, 이미 다 찬 것 같은데요...'
  dismiss_leave:
    templates:
    - id: dismiss_leave_0
      pattern: '아, 알겠어요... 조심히 다니세요.'
    - id: dismiss_leave_1
      pattern: '...네, 미안해요. 짐이 됐죠.'
  vote_advance:
    templates:
    - id: vote_advance_0
      pattern: '...가, 가야 한다면 가겠지만...'
    - id: vote_advance_1
      pattern: '계속 가는 게 맞나요...?'
  vote_return:
    templates:
    - id: vote_return_0
      pattern: '돌, 돌아가요. 위험해요.'
    - id: vote_return_1
      pattern: '여기까지만 해요, 네?'
