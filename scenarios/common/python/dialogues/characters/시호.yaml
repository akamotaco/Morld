# 시호 (Shiho) — 츤데레 캐릭터
# 베이스 archetype: cold (외층 거리감 공유)
# 캐릭터 시그니처: outer 차가움 vs inner 따뜻함 + 시호 고유 츤데레 어조
# 대사 풀: archetype_dialogues/cold/{context}.yaml + 아래 dialogue_overrides

character: 시호
archetype: cold
era: modern
sex: F

# inner_profile.warmth=0.4가 핵심 — cold 디폴트 inner와 분리되는 시호 시그니처
outer_profile:
  formality: -0.3
  warmth: -0.1
  aggression: 0.3
  verbosity: 0.1
  maturity: 0.2

inner_profile:
  formality: 0.1
  warmth: 0.4
  aggression: -0.1
  verbosity: 0.6
  maturity: 0.2

dialogue_overrides:
  daily:
    intents:
      greet:
        # 츤데레 시그니처 인사 — 부정 후 수용, 기다림 부정, 잠깐의 밝음
        add_templates:
          - id: shiho_specific_wait
            pattern: "{shiho_wait_expr}, 너 {shiho_late_note}{end}"
            state_bias: { affinity: 0.75, embarrassment: 0.5 }
            inner_bias: { affinity: 0.85, warmth: 0.7, verbosity: 0.8 }
          - id: shiho_annoyed
            pattern: '{interj}, 또 왔네{end}'
            state_bias: { affinity: 0.5, aggression: 0.3 }
            inner_bias: { affinity: 0.5, warmth: 0.3 }
          - id: shiho_why_ask
            pattern: '왜 {freq} 말 거는 건데{end}'
            state_bias: { embarrassment: 0.5, affinity: 0.4 }
            inner_bias: { affinity: 0.7, warmth: 0.5, verbosity: 0.6 }
          - id: shiho_tsun_wait
            pattern: '...{wait_verb}. 기다렸... 아니, {deny}{end}'
            state_bias: { affinity: 0.7, embarrassment: 0.6 }
            inner_bias: { affinity: 0.8, warmth: 0.6, verbosity: 0.8 }
          - id: shiho_bright_rare
            pattern: '...{bright}. 오늘은 좀 기분 나쁘지 않아{end}'
            state_bias: { affinity: 0.6, arousal: 0.4, embarrassment: 0.2 }
            inner_bias: { affinity: 0.8, warmth: 0.6 }
          - id: shiho_nervous
            pattern: '{stutter_lite}.. 왔구나{end}'
            state_bias: { embarrassment: 0.7, affinity: 0.6 }
            inner_bias: { affinity: 0.8, warmth: 0.6, verbosity: 0.5 }
        add_slots:
          shiho_wait_expr: [ "...한참 기다렸잖아", "...늦었다니까", "...왜 이렇게 늦어" ]
          shiho_late_note: [ "또 어디 가 있었어", "연락이라도 좀 해줘", "걱정했잖아" ]
          interj: [ "어", "응", "흥", "...아" ]
          freq: [ "자꾸", "매번", "계속" ]
          wait_verb: [ "늦었잖아", "왜 이제 와", "한참 찾았잖아" ]
          deny: [ "별로 안 기다렸어", "뭐 기다린 건 아니지만", "아니, 신경 안 썼어" ]
          bright: [ "어", "응", "...아" ]
          stutter_lite: [ "어, 어", "아, 너", "야, 너" ]
          end: [ ".", "..", "..." ]

      thank:
        # 츤데레 감사 — 부정/머뭇/딱히 류
        add_templates:
          - id: shiho_tsun_accept
            pattern: '{hedge} 받긴 할게. {refusal}{end}'
            state_bias: { embarrassment: 0.8, affinity: 0.6 }
            inner_bias: { affinity: 0.8, warmth: 0.6, verbosity: 0.7 }
          - id: shiho_sincere
            pattern: '...정말, 고마워. {strength}로{end}'
            state_bias: { affinity: 0.8, trust: 0.7, embarrassment: 0.2 }
            inner_bias: { affinity: 0.9, warmth: 0.7, trust: 0.7 }
          - id: shiho_long_tsun
            pattern: '{hedge} 받고 싶진 않았지만... {accept}{end}'
            state_bias: { embarrassment: 0.7, affinity: 0.5, verbosity: 0.4 }
            inner_bias: { affinity: 0.7, warmth: 0.5, verbosity: 0.7 }
          - id: shiho_stutter_thanks
            pattern: '{stutter}고, 고마워{end}'
            state_bias: { embarrassment: 0.9, affinity: 0.7 }
            inner_bias: { affinity: 0.9, warmth: 0.7, verbosity: 0.8 }
          - id: shiho_gift_accept
            pattern: '{emph} 필요한 건 아니었는데. {soft_end}'
            state_bias: { embarrassment: 0.6, affinity: 0.5 }
            inner_bias: { affinity: 0.7, warmth: 0.5 }
          - id: shiho_deflect
            pattern: '{hedge}. 다음엔 사양할게{end}'
            state_bias: { embarrassment: 0.5, affinity: 0.4, aggression: 0.3 }
            inner_bias: { affinity: 0.6, warmth: 0.4 }
        add_slots:
          emph: [ "딱히", "별로", "뭐", "...진짜" ]
          hedge: [ "그냥", "아무튼", "이거" ]
          refusal: [ "고맙다고는 안 해", "착각하지 마", "기대하진 마" ]
          stutter: [ "어, 어... ", "그, ", "우, " ]
          strength: [ "진짜", "정말", "확실히" ]
          accept: [ "뭐, 받을게", "받긴 할게", "그래도 받을게" ]
          soft_end: [ "...", "..", "." ]
          end: [ ".", "..", "..." ]

      complain:
        # 츤데레 푸념 — 짜증과 속내 섞임
        add_templates:
          - id: shiho_soft_vent
            pattern: '...그냥, {reason}{end}'
            state_bias: { fatigue: 0.6, affinity: 0.5, embarrassment: 0.4 }
            inner_bias: { fatigue: 0.6, affinity: 0.6, warmth: 0.4, verbosity: 0.4 }
          - id: shiho_sigh_deep
            pattern: '하아... {sigh_content}{end}'
            state_bias: { fatigue: 0.7, affinity: 0.5 }
            inner_bias: { fatigue: 0.7, affinity: 0.5, warmth: 0.2 }
          - id: shiho_self_frust
            pattern: '{self_blame}. {regret}{end}'
            state_bias: { embarrassment: 0.5, confidence: -0.3 }
            inner_bias: { affinity: 0.4, verbosity: 0.3 }
          - id: shiho_sulk_short
            pattern: '{sulk}{end}'
            state_bias: { affinity: 0.5, embarrassment: 0.5 }
            inner_bias: { affinity: 0.7, warmth: 0.4 }
        add_slots:
          reason: [ "좀 힘들어서 그래", "오늘은 그런 기분이야", "아무것도 하기 싫어" ]
          sigh_content: [ "오늘 진짜 별로야", "왜 이렇게 꼬이지", "다 귀찮아" ]
          self_blame: [ "내가 왜 이런 걸", "또 나야", "어째서 나만" ]
          regret: [ "한심해", "바보같아", "속상해" ]
          sulk: [ "흥", "쳇", "됐어" ]
          end: [ ".", "..", "...", "!" ]
