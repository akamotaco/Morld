# tsundere archetype — daily context
# 공용 대사 풀: 같은 archetype 의 모든 캐릭터가 상속

archetype: tsundere
context: daily
intents:
  greet:
    templates:
    - id: plain_cool
      pattern: '{interj}. 왔어{end}'
      state_bias:
        affinity: 0.3
        arousal: 0.2
    - id: annoyed
      pattern: '{interj}, 또 왔네{end}'
      state_bias:
        affinity: 0.5
        aggression: 0.3
      inner_bias:
        affinity: 0.5
        warmth: 0.3
    - id: why_ask
      pattern: 왜 {freq} 말 거는 건데{end}
      state_bias:
        embarrassment: 0.5
        affinity: 0.4
      inner_bias:
        affinity: 0.7
        warmth: 0.5
        verbosity: 0.6
    - id: tsun_wait
      pattern: '...{wait_verb}. 기다렸... 아니, {deny}{end}'
      state_bias:
        affinity: 0.7
        embarrassment: 0.6
      inner_bias:
        affinity: 0.8
        warmth: 0.6
        verbosity: 0.8
    - id: short_hi
      pattern: 안녕{end}
      state_bias:
        affinity: 0.5
        embarrassment: 0.2
    - id: tired_hello
      pattern: '{interj}. {tired_mark}{end}'
      state_bias:
        fatigue: 0.6
        affinity: 0.3
      inner_bias:
        fatigue: 0.6
        warmth: 0.2
    - id: hostile
      pattern: '{cold_interj}. 뭐 또 필요해{end}'
      state_bias:
        hostility: 0.5
        affinity: 0.2
    - id: bright_rare
      pattern: '...{bright}. 오늘은 좀 기분 나쁘지 않아{end}'
      state_bias:
        affinity: 0.6
        arousal: 0.4
        embarrassment: 0.2
      inner_bias:
        affinity: 0.8
        warmth: 0.6
    - id: nervous
      pattern: '{stutter_lite}.. 왔구나{end}'
      state_bias:
        embarrassment: 0.7
        affinity: 0.6
      inner_bias:
        affinity: 0.8
        warmth: 0.6
        verbosity: 0.5
    - id: brief_nod
      pattern: '{cool_ack}{end}'
      state_bias:
        affinity: 0.4
        confidence: 0.5
    slots:
      interj:
      - token: 어
        feature:
          affinity: 0.3
      - token: 응
        feature:
          affinity: 0.4
          warmth: 0.2
      - token: 흥
        feature:
          aggression: 0.4
          affinity: 0.3
      - token: '...아'
        feature:
          embarrassment: 0.4
      freq:
      - 자꾸
      - 매번
      - 계속
      wait_verb:
      - 늦었잖아
      - 왜 이제 와
      - 한참 찾았잖아
      deny:
      - 별로 안 기다렸어
      - 뭐 기다린 건 아니지만
      - 아니, 신경 안 썼어
      tired_mark:
      - 또 너야
      - 오늘은 봐줘
      - 기운 없어
      cold_interj:
      - 흥
      - 쳇
      - 뭐야
      bright:
      - 어
      - 응
      - '...아'
      stutter_lite:
      - 어, 어
      - 아, 너
      - 야, 너
      cool_ack:
      - 왔군
      - 오셨군
      - 확인
      end:
      - .
      - ..
      - '...'
  thank:
    templates:
    - id: plain
      pattern: 고마워{end}
      state_bias:
        affinity: 0.6
        embarrassment: 0.1
    - id: emph_thanks
      pattern: '{emph}, 고마워{end}'
      state_bias:
        affinity: 0.6
        embarrassment: 0.3
      inner_bias:
        affinity: 0.7
        warmth: 0.5
    - id: tsun_accept
      pattern: '{hedge} 받긴 할게. {refusal}{end}'
      state_bias:
        embarrassment: 0.8
        affinity: 0.6
      inner_bias:
        affinity: 0.8
        warmth: 0.6
        verbosity: 0.7
    - id: sincere
      pattern: '...정말, 고마워. {strength}로{end}'
      state_bias:
        affinity: 0.8
        trust: 0.7
        embarrassment: 0.2
      inner_bias:
        affinity: 0.9
        warmth: 0.7
        trust: 0.7
    - id: long_tsun
      pattern: '{hedge} 받고 싶진 않았지만... {accept}{end}'
      state_bias:
        embarrassment: 0.7
        affinity: 0.5
        verbosity: 0.4
      inner_bias:
        affinity: 0.7
        warmth: 0.5
        verbosity: 0.7
    - id: stutter
      pattern: '{stutter}고, 고마워{end}'
      state_bias:
        embarrassment: 0.9
        affinity: 0.7
      inner_bias:
        affinity: 0.9
        warmth: 0.7
        verbosity: 0.8
    - id: gift_accept
      pattern: '{emph} 필요한 건 아니었는데. {soft_end}'
      state_bias:
        embarrassment: 0.6
        affinity: 0.5
      inner_bias:
        affinity: 0.7
        warmth: 0.5
    - id: surprised
      pattern: '...{surprise}. 나한테? 고마워{end}'
      state_bias:
        affinity: 0.5
        embarrassment: 0.4
      inner_bias:
        affinity: 0.8
        warmth: 0.6
    - id: fatigue_thanks
      pattern: '...고마워. {fatigue_note}{end}'
      state_bias:
        affinity: 0.6
        fatigue: 0.6
      inner_bias:
        affinity: 0.7
        warmth: 0.4
        fatigue: 0.6
    - id: firm_cool
      pattern: 잘 받을게{end}
      state_bias:
        affinity: 0.5
        confidence: 0.5
    - id: deflect
      pattern: '{hedge}. 다음엔 사양할게{end}'
      state_bias:
        embarrassment: 0.5
        affinity: 0.4
        aggression: 0.3
      inner_bias:
        affinity: 0.6
        warmth: 0.4
    slots:
      emph:
      - token: 딱히
        feature:
          embarrassment: 0.6
          warmth: -0.1
      - token: 별로
        feature:
          embarrassment: 0.5
          aggression: 0.2
      - token: 뭐
        feature:
          embarrassment: 0.3
      - token: '...진짜'
        feature:
          embarrassment: 0.4
          affinity: 0.6
      hedge:
      - 그냥
      - 아무튼
      - 이거
      refusal:
      - 고맙다고는 안 해
      - 착각하지 마
      - 기대하진 마
      stutter:
      - '어, 어... '
      - '그, '
      - '우, '
      end:
      - .
      - ..
      - '...'
      strength:
      - 진짜
      - 정말
      - 확실히
      accept:
      - 뭐, 받을게
      - 받긴 할게
      - 그래도 받을게
      surprise:
      - 어?
      - 뭐야
      - 어어
      fatigue_note:
      - 지금은 이 정도밖에 못 말하겠어
      - 뭐라 더 말할 기운이 없어
      - 진짜로 피곤해서 길게는 못 해
      soft_end:
      - '...'
      - ..
      - .
  complain:
    templates:
    - id: short_angry
      pattern: 아, 진짜 짜증나{end}
      state_bias:
        arousal: 0.6
        aggression: 0.5
    - id: tired
      pattern: 오늘 좀 피곤해. {dismiss}{end}
      state_bias:
        fatigue: 0.7
        verbosity: -0.2
      inner_bias:
        fatigue: 0.8
        warmth: -0.2
        verbosity: -0.3
    - id: unfair
      pattern: 왜 {scope} 나한테만 시키는 거야{end}
      state_bias:
        aggression: 0.5
        verbosity: 0.4
    - id: soft_vent
      pattern: '...그냥, {reason}{end}'
      state_bias:
        fatigue: 0.6
        affinity: 0.5
        embarrassment: 0.4
      inner_bias:
        fatigue: 0.6
        affinity: 0.6
        warmth: 0.4
        verbosity: 0.4
    - id: dismiss
      pattern: 그게 뭐가 중요해{end}
      state_bias:
        aggression: 0.3
    - id: sigh_deep
      pattern: 하아... {sigh_content}{end}
      state_bias:
        fatigue: 0.7
        affinity: 0.5
      inner_bias:
        fatigue: 0.7
        affinity: 0.5
        warmth: 0.2
    - id: snap_back
      pattern: 됐어. {snap_expr}{end}
      state_bias:
        aggression: 0.6
        hostility: 0.3
    - id: self_frust
      pattern: '{self_blame}. {regret}{end}'
      state_bias:
        embarrassment: 0.5
        confidence: -0.3
      inner_bias:
        affinity: 0.4
        verbosity: 0.3
    - id: sulk_short
      pattern: '{sulk}{end}'
      state_bias:
        affinity: 0.5
        embarrassment: 0.5
      inner_bias:
        affinity: 0.7
        warmth: 0.4
    - id: demand
      pattern: 왜 나만 {burden}{end}
      state_bias:
        aggression: 0.5
        fatigue: 0.5
    slots:
      dismiss:
      - 말 걸지 마
      - 좀 가만히 둬
      - 내버려 둬
      scope:
      - 다들
      - 매번
      - 항상
      reason:
      - 좀 힘들어서 그래
      - 오늘은 그런 기분이야
      - 아무것도 하기 싫어
      sigh_content:
      - 오늘 진짜 별로야
      - 왜 이렇게 꼬이지
      - 다 귀찮아
      snap_expr:
      - 그만 좀 해
      - 말 시키지 마
      - 혼자 있게 해줘
      self_blame:
      - 내가 왜 이런 걸
      - 또 나야
      - 어째서 나만
      regret:
      - 한심해
      - 바보같아
      - 속상해
      sulk:
      - 흥
      - 쳇
      - 됐어
      burden:
      - 이런 거 해야 돼
      - 고생해야 해
      - 맡아야 돼
      end:
      - .
      - ..
      - '...'
      - '!'
