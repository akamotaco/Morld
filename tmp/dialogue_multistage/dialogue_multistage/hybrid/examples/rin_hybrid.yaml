# =============================================================
# 린 (Rin) — Deredere — Hybrid Template+Slot
# =============================================================
character: 린
archetype: deredere
era: modern
sex: F

outer_profile:
  formality: -0.2
  warmth: 0.7
  aggression: -0.3
  verbosity: 0.5
  maturity: -0.3

# 표리일체 — inner_profile 생략

intents:

  greet:
    templates:
      - id: plain_bright
        pattern: "안녕하세요{emph}"
        state_bias: { arousal: 0.4, affinity: 0.4 }
      - id: welcome_energy
        pattern: "{interj}! 오셨어요! 반가워요{emph}"
        state_bias: { affinity: 0.8, arousal: 0.8 }
      - id: cute_wait
        pattern: "{soft_interj}, 기다리고 있었어요{soft_end}"
        state_bias: { affinity: 0.7 }
      - id: cheer
        pattern: "어서 오세요! 오늘도 {cheer_phrase}{emph}"
        state_bias: { arousal: 0.7, confidence: 0.5 }
      - id: short_hello
        pattern: "반가워요{soft_end}"
        state_bias: { affinity: 0.5 }
    slots:
      interj:
        - { token: "와",   feature: { arousal: 0.7 } }
        - { token: "앗",   feature: { arousal: 0.6 } }
        - { token: "우와", feature: { arousal: 0.8 } }
      soft_interj: [ "헤헤", "에헤헤", "후후" ]
      cheer_phrase: [ "힘내요", "파이팅이에요", "잘 부탁드려요" ]
      emph: [ "!", "!!", "~" ]
      soft_end: [ "~", "..", "!" ]

  thank:
    templates:
      - id: plain_happy
        pattern: "고마워요{emph}"
        state_bias: { affinity: 0.6, arousal: 0.4 }
      - id: super_excited
        pattern: "{interj}! 정말 정말 {thank_phrase}{emph}"
        state_bias: { affinity: 0.9, arousal: 0.85 }
      - id: cute_thank
        pattern: "{soft_interj}, 고마워요~ {extra}{emph}"
        state_bias: { affinity: 0.8, arousal: 0.5 }
      - id: moved
        pattern: "{sob}, 너무 감동이에요{soft_end}"
        state_bias: { affinity: 0.85, arousal: 0.5 }
      - id: short_praise
        pattern: "짱이에요{emph}"
        state_bias: { arousal: 0.7, affinity: 0.6 }
    slots:
      interj:
        - { token: "와아",   feature: { arousal: 0.85 } }
        - { token: "아아",   feature: { arousal: 0.7 } }
        - { token: "우와",   feature: { arousal: 0.8 } }
      soft_interj: [ "헤헤", "에헤헤", "후훗" ]
      thank_phrase: [ "감사합니다", "고마워요", "감사해요" ]
      extra: [ "좋아해요", "최고예요", "행복해요" ]
      sob: [ "흑", "히잉", "흐응" ]
      emph: [ "!", "!!", "~" ]
      soft_end: [ "...", "..", "~" ]

  complain:
    templates:
      - id: tired_short
        pattern: "힘들어요{soft_end}"
        state_bias: { fatigue: 0.7 }
      - id: frustration
        pattern: "아 진짜, 왜 이렇게 {fail_verb}{soft_end}"
        state_bias: { fatigue: 0.6, aggression: 0.3 }
      - id: hungry
        pattern: "배고파요! {food_want}{emph}"
        state_bias: { fatigue: 0.4, arousal: 0.5 }
      - id: exhausted
        pattern: "오늘 너무 피곤해요{soft_end}"
        state_bias: { fatigue: 0.8 }
      - id: uncertain
        pattern: "으응... 잘 {unsure_verb}{soft_end}"
        state_bias: { confidence: -0.4 }
    slots:
      fail_verb: [ "안 돼요", "안 풀려요", "이게 안 되는 거죠" ]
      food_want: [ "밥 먹고 싶어요", "간식 먹고 싶어요", "뭐라도 먹어야겠어요" ]
      unsure_verb: [ "모르겠어요", "기억이 안 나요", "이해가 안 돼요" ]
      emph: [ "!", "!!", "~" ]
      soft_end: [ "ㅠㅠ", "...", ".." ]
