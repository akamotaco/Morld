# =============================================================
# 유카 (Yuka) — Kuudere — Hybrid Template+Slot
# =============================================================
character: 유카
archetype: kuudere
era: near_future
sex: F

outer_profile:
  formality: 0.5
  warmth: -0.5
  aggression: -0.3
  verbosity: -0.7
  maturity: 0.6

inner_profile:
  formality: 0.5
  warmth: -0.2
  aggression: -0.3
  verbosity: -0.4
  maturity: 0.6

intents:

  greet:
    templates:
      - id: plain_formal
        pattern: "안녕하십니까{end}"
        state_bias: { affinity: 0.3 }
      - id: confirm
        pattern: "{scan}{end}"
        state_bias: { confidence: 0.5 }
      - id: acknowledge
        pattern: "오셨군요{end}"
        state_bias: { affinity: 0.6 }
      - id: soft_miss
        pattern: "...{miss_expr}{end}"
        state_bias: { affinity: 0.85, trust: 0.7 }
      - id: concern
        pattern: "...{concern_expr}?"
        state_bias: { affinity: 0.75 }
    slots:
      scan:
        - { token: "접속 확인", feature: { confidence: 0.6 } }
        - { token: "인증 완료", feature: { formality: 0.5 } }
        - { token: "연결 확인", feature: { confidence: 0.4 } }
      miss_expr:
        - "보고 싶었습니다"
        - "기다렸습니다"
        - "돌아오셨군요"
      concern_expr:
        - "괜찮으십니까"
        - "별일 없으셨습니까"
      end: [ ".", "..", "..." ]

  thank:
    templates:
      - id: formal_thanks
        pattern: "감사합니다{end}"
        state_bias: { affinity: 0.3 }
      - id: minimal
        pattern: "감사{end}"
        state_bias: { affinity: 0.2 }
      - id: functional
        pattern: "{effect}{end}"
        state_bias: { affinity: 0.5 }
      - id: sincere
        pattern: "...{emph_adv}, 고맙습니다{end}"
        state_bias: { affinity: 0.85, trust: 0.8 }
    slots:
      effect:
        - "도움이 되었습니다"
        - "유용했습니다"
        - "큰 도움이 되었습니다"
      emph_adv: [ "정말로", "진심으로", "무척" ]
      end: [ ".", "..", "..." ]

  complain:
    templates:
      - id: load_report
        pattern: "{metric} 임계치 근접{end}"
        state_bias: { fatigue: 0.7 }
      - id: efficiency
        pattern: "효율이 떨어지고 있습니다{end}"
        state_bias: { fatigue: 0.6 }
      - id: short
        pattern: "부하가 높습니다{end}"
        state_bias: { fatigue: 0.65 }
      - id: request_rest
        pattern: "...{rest_req}{end}"
        state_bias: { fatigue: 0.7, affinity: 0.6 }
      - id: uncertain
        pattern: "판단 보류{end}"
        state_bias: { confidence: -0.3 }
    slots:
      metric: [ "피로도", "연산 부하", "자원 소모량" ]
      rest_req:
        - "조금 쉬고 싶습니다"
        - "잠시 대기 요청"
        - "재충전이 필요합니다"
      end: [ ".", "..", "..." ]
